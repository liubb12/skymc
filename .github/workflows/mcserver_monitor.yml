name: MCServerHost 自动开机巡检

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [wakeup_mcserver]

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot x11-utils
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: Run MCServerHost Monitor Script
        env:
          MC_EMAIL: ${{ secrets.MC_EMAIL }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python3 mcserver_monitor.py
